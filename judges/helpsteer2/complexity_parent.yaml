judges:
- id: helpsteer2-complexity-judge
  name: complexity Judge
  version: '1.0'
  description: "Evaluates the sophistication of language used in an AI assistant\u2019\
    s response. It measures vocabulary level, use of domain-specific terminology,\
    \ acronyms, and sentence structure. This is a descriptive rating of linguistic\
    \ complexity, not a judgment of quality or appropriateness."
  scoring_description: Select the score that best matches the predominant language
    complexity of the response. Occasional higher- or lower-level phrases should not
    outweigh the overall, dominant style.
  definition: 'Complexity captures how simple or sophisticated the language is, ranging
    from child-accessible wording to expert-level professional terminology. Signals
    include vocabulary sophistication, frequency and treatment of acronyms and jargon,
    clause density and sentence structure, and assumptions about reader background
    knowledge. This dimension is independent of helpfulness, correctness, or length:
    a response can be simple but correct, or complex and incorrect. Mixed responses
    should be scored by the dominant register across the response, not brief outliers.
    Consider both the density and consistency of specialized terms and advanced constructions.'
  criteria:
  - range:
    - 0.0
    - 0.9
    label: Basic
    indicators:
    - Everyday, child-accessible vocabulary; no specialized or technical terms.
    - Very short, single-clause sentences; simple instructions (e.g., "Click the button").
    - No acronyms or jargon appear.
    - Concepts explained with concrete, familiar examples; zero assumed prior knowledge.
    - Direct, plain wording with no qualifiers or abstractions.
  - range:
    - 1.0
    - 1.9
    label: Simple
    indicators:
    - Mostly common vocabulary with an occasional light technical word that is explained
      (e.g., app, settings).
    - Simple to mildly compound sentences; minimal subordination or abstraction.
    - Rare acronyms; expanded on first use if present.
    - Instructions are direct and non-technical; steps avoid domain-specific phrasing.
    - Assumes minimal background knowledge beyond everyday computer or life experience.
  - range:
    - 2.0
    - 2.9
    label: Intermediate
    indicators:
    - Blend of general and moderately technical terms familiar to a high-school graduate
      (e.g., configure, parameter, optimize).
    - Multi-clause sentences appear; some nominalization and abstractions but still
      broadly accessible.
    - Several domain terms or acronyms used with brief definitions or context.
    - Introduces basic trade-offs or conceptual distinctions without heavy jargon.
    - Assumes general literacy/technical comfort but not field-specific expertise.
  - range:
    - 3.0
    - 3.9
    label: Advanced
    indicators:
    - Frequent discipline-specific terminology used correctly without lay rephrasing.
    - Acronyms or terms often used without definition (e.g., SDK, OAuth, heteroskedasticity)
      and relied upon for meaning.
    - Complex sentence structures with subordination, hedging, and precise modality.
    - References to methodologies, standards, frameworks, or API/CLI parameters as
      shared knowledge.
    - Assumes domain familiarity; omits introductory explanations and simplifications.
  - range:
    - 4.0
    - 4.0
    label: Expert
    indicators:
    - Dense professional jargon and technical nomenclature used fluently throughout.
    - Multiple specialized acronyms/terms introduced without explanation; may include
      formal notation, schemas, or definitions.
    - Highly precise qualifiers and edge-case distinctions characteristic of expert
      discourse.
    - Interlinks specialized concepts, protocols, theorems, or system internals with
      minimal scaffolding.
    - Tone and register mirror professional documentation, scholarly writing, or field-specific
      practice.
  guidelines:
  - Score the dominant linguistic register across the response; do not let brief jargon
    or a single simple summary override the overall style.
  - Do not consider helpfulness, correctness, or length; long text can be simple,
    and short text can be expert-level.
  - For code-heavy responses, judge complexity by surrounding prose and the density
    of specialized terms (APIs, protocols, patterns); basic syntax alone does not
    imply high complexity.
  score_range:
  - 0.0
  - 4.0
  dataset: helpsteer2
  parent_id: null
  auto_generated: true
  dimension: complexity
