data_file: datasets/processed/ultrafeedback_validation.pkl
description: Validate backward elimination pipeline with 10 UltraFeedback parent judges
gam_lam: 0.6
gam_n_splines: 10
initial_judge_file: judges/ultrafeedback/depth_0_parents.yaml
llm_model: openai/gpt-5-nano
max_correlation: 0.9
max_iterations: 20
max_judges: 100
min_judges: 5
