# Validation Experiment Configuration
# Test backward elimination with 10 UltraFeedback parent judges only
# Goal: Select 6 judges from pool of 10 to validate pipeline

name: "validation-ultrafeedback-parents"
description: "Validate backward elimination pipeline with 10 UltraFeedback parent judges"

# Initial judge set - Only UltraFeedback parent judges (10 total)
initial_judge_file: "judges/ultrafeedback/depth_0_parents.yaml"

# No protected judges for validation
protected_judges: []

# Data configuration
data_file: "datasets/processed/ultrafeedback_validation.pkl"
target_column: "target"  # Averaged persona scores
train_test_split: 0.3
validation_split: 0.15

# Stopping criteria for BACKWARD ELIMINATION
max_iterations: 20  # 10 judges -> 6 judges = 4 iterations minimum
target_judges: 6    # Select 6 judges from 10
min_judges: 5       # Safety threshold
r2_degradation_threshold: 0.05  # Stop if R² drops by more than 5%
plateau_patience: 3
selection_mode: "backward"

# Redundancy threshold
max_correlation: 0.9

# GAM settings
gam_n_splines: 10
gam_lam: 0.6

# Output
output_dir: "results/validation_ultrafeedback_parents"
save_intermediate: true
