# Iterative Judge Selection Experiment Configuration (Prune Half)

name: "iterative-selection-helpsteer2-prune-half-full"
description: "Prune to half the judges (30 -> 15) for HelpSteer2 full dataset"

# Initial judge set configuration
initial_judge_file: "judges/helpsteer2/all_judges.yaml"

# Judges that should never be removed (core evaluation dimensions)
protected_judges:
  - "helpsteer2-helpfulness-judge"
  - "helpsteer2-correctness-judge"

# Data configuration
data_file: "datasets/helpsteer2_track3_full_dataset.pkl"
target_column: "target"
train_test_split: 0.3
validation_split: 0.15

# Stopping criteria
max_iterations: 20
min_judges: 15
target_judges: 15  # 30 -> 15 judges
max_judges: 30
r2_improvement_threshold: 0.0
plateau_patience: 50

# Redundancy control
max_correlation: 0.9

# Judge proposal settings
proposal_mode: "decompose"
use_llm_suggestions: false
llm_model: "openai/gpt-5-nano"

# GAM hyperparameters (from Track 2 tuning)
gam_n_splines: 10
gam_lam: 0.6

# Output configuration
output_dir: "results/selection_prune_half"
save_intermediate: true
