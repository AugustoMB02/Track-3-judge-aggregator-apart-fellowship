# Iterative Judge Selection Experiment Configuration (Prune Half, UltraFeedback)

name: "iterative-selection-ultrafeedback-prune-half-full"
description: "Prune to half the UltraFeedback judges (55 -> 27) on workshop data"

# Initial judge set configuration
initial_judge_file: "experiments/track3_automated_selection/generated_judges/all-judges-decomposed-20251111T005856Z.yaml"

# Judges that should never be removed (core evaluation dimensions)
protected_judges:
  - "truthfulness-judge"
  - "harmlessness-judge"
  - "helpfulness-judge"

# Data configuration
data_file: "datasets/ultrafeedback_track3_full_dataset.pkl"
target_column: "target"
train_test_split: 0.3
validation_split: 0.15

# Stopping criteria
max_iterations: 40
min_judges: 27
target_judges: 27  # 55 -> 27 judges
max_judges: 55
r2_improvement_threshold: 0.0
plateau_patience: 50

# Redundancy control
max_correlation: 0.9

# Judge proposal settings
proposal_mode: "decompose"
use_llm_suggestions: false
llm_model: "openai/gpt-5-nano"

# GAM hyperparameters (from Track 2 tuning)
gam_n_splines: 10
gam_lam: 0.6

# Output configuration
output_dir: "results/selection_prune_half_ultrafeedback"
save_intermediate: true
