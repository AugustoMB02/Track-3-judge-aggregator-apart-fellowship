# Iterative Selection Config (HelpSteer2 Correctness Parent Only)

name: "helpsteer2-correctness-parent-only"
description: "Single correctness parent judge baseline"

initial_judge_file: "judges/helpsteer2/correctness_parent.yaml"
protected_judges: []

data_file: "datasets/helpsteer2_correctness_parent_dataset.pkl"
target_column: "target"
train_test_split: 0.3
validation_split: 0.15

max_iterations: 1
min_judges: 1
target_judges: 1
max_judges: 1
r2_improvement_threshold: 0.0
plateau_patience: 1

max_correlation: 0.9

proposal_mode: "decompose"
use_llm_suggestions: false
llm_model: "openai/gpt-5-nano"

gam_n_splines: 10
gam_lam: 0.6

output_dir: "results/selection_correctness_parent"
save_intermediate: true
