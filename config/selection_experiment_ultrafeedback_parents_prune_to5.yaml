# Iterative Selection Config (UltraFeedback Parents Prune to 5)

name: "ultrafeedback-parents-prune-to-5"
description: "Prune UltraFeedback parent judges to 5 using workshop dataset"

initial_judge_file: "judges/ultrafeedback/depth_0_parents.yaml"
protected_judges: []

data_file: "datasets/ultrafeedback_track3_parents_dataset.pkl"
target_column: "target"
train_test_split: 0.3
validation_split: 0.15

max_iterations: 20
min_judges: 5
target_judges: 5
max_judges: 10
r2_improvement_threshold: 0.0
plateau_patience: 50

max_correlation: 0.9

proposal_mode: "decompose"
use_llm_suggestions: false
llm_model: "openai/gpt-5-nano"

gam_n_splines: 10
gam_lam: 0.6

output_dir: "results/selection_ultrafeedback_parents_prune_to5"
save_intermediate: true
